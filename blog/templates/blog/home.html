{% extends "blog/base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
    <h1>Welcome to DjangoBlog</h1>

    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
        </article>
    {% empty %}
        <p>No blog posts available.</p>
    {% endfor %}

{% endblock %}
