
{% if page_obj.has_other_pages %}

<nav class="mt-4" aria-label="Post pagination">

    <ul class="pagination justify-content-center">

        {% if page_obj.has_previous %}
            <li class="page-item">
                <a
                    class="page-link"
                    href="?page={{ page_obj.previous_page_number }}{% if request.GET.category %}&category={{ request.GET.category }}{% endif %}{% if request.GET.tag %}&tag={{ request.GET.tag }}{% endif %}"
                >
                    Previous
                </a>
            </li>
        {% endif %}

        <li class="page-item active" aria-current="page">
            <span class="page-link">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        {% if page_obj.has_next %}
            <li class="page-item">
                <a
                    class="page-link"
                    href="?page={{ page_obj.next_page_number }}{% if request.GET.category %}&category={{ request.GET.category }}{% endif %}{% if request.GET.tag %}&tag={{ request.GET.tag }}{% endif %}"
                >
                    Next
                </a>
            </li>
        {% endif %}

    </ul>

</nav>

{% endif %}
