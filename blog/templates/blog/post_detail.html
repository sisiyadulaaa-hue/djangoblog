{% extends "blog/base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}

<h1>{{ post.title }}</h1>

<p class="text-muted">
    {{ post.created_at|date:"M d, Y" }}
</p>

{% if post.category %}
    <span class="badge bg-secondary">
        {{ post.category.name }}
    </span>
{% endif %}

<p>
    {{ post.content }}
</p>

{% endblock %}
